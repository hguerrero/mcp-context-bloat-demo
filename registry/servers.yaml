# MCP servers for the demo. The first three are the real ones and point at the gateway.
# The rest are decoys that make the catalog look like a real one (their URLs do not exist).
apiVersion: ar.dev/v1alpha1
kind: MCPServer
metadata:
  name: jokes
  labels:
    demo: context-bloat
spec:
  title: Chuck Norris Jokes
  description: "Random and searchable Chuck Norris jokes, by category. Use for humor, jokes and fun facts."
  remote:
    type: streamable-http
    url: http://localhost:3000/mcp/jokes
---
apiVersion: ar.dev/v1alpha1
kind: MCPServer
metadata:
  name: github
  labels:
    demo: context-bloat
spec:
  title: GitHub (read-only)
  description: "Read-only GitHub: repositories, releases, commits, issues, pull requests, code search and file contents."
  remote:
    type: streamable-http
    url: http://localhost:3000/mcp/github
---
